<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Docs</title>
  </head>
  <body>
    <h1>Working with media</h1>

    <audio controls>
      <source src="./media/audio/music.mp3" type="" />
    </audio>

    <video controls>
      <source src="./media/video/video.mp4" type="" />
    </video>

    <iframe
      src="./index.html"
      frameborder="0"
      width="560"
      height="315"
      allowfullscreen
    ></iframe>

    <!-- Loading youtue video in our page -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/9iD-lch5vTQ"
      allowfullscreen
    >
    </iframe>

    <iframe
      src="https://www.youtube.com/embed/Lu8lXXlstvM?si=w5W9Mk8hWZjYohs7"
      frameborder="0"
    ></iframe>

    <!-- Google iframe -->
    <div class="mapouter">
      <div class="gmap_canvas">
        <iframe
          width="672"
          height="391"
          id="gmap_canvas"
          src="https://maps.google.com/maps?q=H-%20Medix%20Payless%2C%20Plot%2036%20Lagos%20Cres%2C%20Garki%2C%20Abuja%20900110%2C&t=&z=17&ie=UTF8&iwloc=&output=embed"
          frameborder="0"
          scrolling="no"
          marginheight="0"
          marginwidth="0"
        ></iframe
        ><a href="http://vin-odometer.info">vin-odometer.info</a><br /><style>
          .mapouter {
            position: relative;
            text-align: right;
            height: 391px;
            width: 672px;
          }</style
        ><a href="https://embedmaps.info">Embed Google Maps</a
        ><style>
          .gmap_canvas {
            overflow: hidden;
            background: none !important;
            height: 391px;
            width: 672px;
          }
        </style>
      </div>
    </div>
  </body>
</html>

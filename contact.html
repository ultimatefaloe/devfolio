<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevFolio | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>

  <header id="site-header">
    <nav id="main-nav">
      <a href="index.html" class="nav-logo">DevFolio</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
    </nav>
  </header>

  <main class="contact-page section">
    <div class="section-inner">
      <h1 class="section-title">Get In Touch</h1>
      <p class="page-subtitle">Have a project in mind? Fill in the form and I will get back to you.</p>

      <form id="contact-form" novalidate>

        <div class="form-group">
          <label for="name">Full Name <span aria-hidden="true">*</span></label>
          <input type="text" id="name" name="name" required
                 placeholder="e.g. Amaka Obi" autocomplete="name">
          <span class="error-msg" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" required
                 placeholder="you@example.com" autocomplete="email">
          <span class="error-msg" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="service">Service Needed</label>
          <select id="service" name="service">
            <option value="">— Choose a service —</option>
            <option value="website">Website Design</option>
            <option value="webapp">Web Application</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message <span aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="5" required
                    placeholder="Tell me about your project..."></textarea>
          <span class="error-msg" id="message-error"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Send Message</button>
        <p id="form-success" class="success-msg hidden">
          &#10003; Message sent! I will reply within 24 hours.
        </p>

      </form>
    </div>
  </main>

  <footer id="site-footer">
    <p>&copy; <span class="footer-year"></span> DevFolio. Built with &#10084;</p>
    <div class="footer-links">
      <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:hello@devfolio.com">Email</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>

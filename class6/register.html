<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
  </head>
  <body>
    <nav>
      <!-- Left side contains logo -->
      <div class="">
        <h1>Logo</h1>
      </div>
      <!-- Right side contains links -->
      <ul class="">
        <li><a href="./index.html">Home</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <div class="cta">
        <a href="./login.html">Login</a>
        <a href="./register.html">Sign Up</a>
      </div>
    </nav>

    <main>
      <h1>Sign Up</h1>
      <form action="" method="post" novalidate >
        <!-- First Name input -->
        <div class="input-group">
          <div class="label">
            <label for="fname">First Name:</label>
          </div>
          <div class="input">
            <input
              type="text"
              name="fname"
              id="fname"
              placeholder="John"
              required
            />
          </div>
        </div>

        <!-- Last Name input -->
        <div class="input-group">
          <div class="label">
            <label for="lname">Last Name:</label>
          </div>
          <div class="input">
            <input
              type="text"
              name="lname"
              id="lname"
              placeholder="Doe"
              required
            />
          </div>
        </div>

        <!-- User Name input -->
        <div class="input-group">
          <div class="label">
            <label for="username">Username:</label>
          </div>
          <div class="input">
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Doe"
              required
            />
          </div>
        </div>

        <!-- User Phone input -->
        <div class="input-group">
          <div class="label">
            <label for="email">Email:</label>
          </div>
          <div class="input">
            <input
              type="email"
              name="email"
              id="email"
              placeholder="ex@gmail.com"
              required
            />
          </div>
        </div>

        <!-- User Phone input -->
        <div class="input-group">
          <div class="label">
            <label for="phone">Username:</label>
          </div>
          <div class="input">
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="0806552672"
              required
            />
          </div>
        </div>

        <!-- Password input -->
        <div class="input-group">
          <div class="label">
            <label for="password">Password:</label>
          </div>
          <div class="input">
            <input
              type="password"
              name="password"
              id="password"
              placeholder="********"
              required
            />
          </div>
        </div>

        <!-- Confirm Password input -->
        <div class="input-group">
          <div class="label">
            <label for="c_password">Confirm Password:</label>
          </div>
          <div class="input">
            <input
              type="password"
              name="c_password"
              id="c_password"
              placeholder="********"
              required
            />
          </div>
        </div>

        <div class="cta">
          <button type="submit">Sign Up</button>
        </div>
      </form>
    </main>
  </body>
</html>

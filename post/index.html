<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List ToDo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      .none {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- nav bar start -->
    <nav class="flex justify-between items-center bg-green-200 px-10">
      <div class="p-2">
        <h1 id="logo" class="text-green-900 font-bold">LOGO</h1>
      </div>

      <div class="p-2">
        <button
          type="button"
          class="flex items-center justify-center gap-2 rounded bg-green-500/30 border border-green-500 py px-3"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
          >
            <path d="M0 0h24v24H0z" fill="none" />
            <path
              fill="#155406"
              d="M18 10h-4V6a2 2 0 0 0-4 0l.071 4H6a2 2 0 0 0 0 4l4.071-.071L10 18a2 2 0 0 0 4 0v-4.071L18 14a2 2 0 0 0 0-4"
            />
          </svg>
          Create
        </button>
      </div>
    </nav>
    <!-- Nav bar end -->

    <main class="flex flex-col justify-center">
      <div class="max-w-5xl p-4 bg-green-100 min-h-screen">
        <form
          id="post_form"
          action=""
          class="flex items-center gap-2 bg-green-200 p-2 rounded"
        >
          <input
            type="text"
            name="title"
            id="title"
            placeholder="Post Title"
            class="py-2 px-4 border border-green-500 text-green-900 rounded"
            required
          />
          <input
            type="text"
            name="body"
            id="body"
            placeholder="Post Desription"
            class="py-2 px-4 border border-green-500 text-green-900 rounded"
            required
          />
          <button
            type="submit"
            class="w-fit py-3 px-3 border border-green-500 text-green-900 rounded cursor-pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <path d="M0 0h24v24H0z" fill="none" />
              <path
                fill="#155406"
                d="M9.55 13.15L18 4.7q.3-.3.713-.3t.712.3t.3.712t-.3.713L10.25 15.3q-.3.3-.7.3t-.7-.3l-4.275-4.275q-.3-.3-.288-.712T4.6 9.6t.713-.3t.712.3zM6 20q-.425 0-.712-.288T5 19t.288-.712T6 18h12q.425 0 .713.288T19 19t-.288.713T18 20z"
              />
            </svg>
          </button>
        </form>

        <!-- All posts -->
        <section
          id="post_container"
          class="grid grid-cols-1 md:grid-cols-2 gap-2 p-2"
        >
          <!-- Post card -->
        </section>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
